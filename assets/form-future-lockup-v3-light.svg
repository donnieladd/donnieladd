  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="280" y="29" fill="#1F2328" font-size="24" font-weight="600" letter-spacing="0.3">VISION NEEDS STRUCTURE</text>
    <text x="280" y="63" fill="#1F2328" font-size="31" font-weight="400">the future needs <tspan fill="#2F6BFF">form.</tspan></text>
  </g>
</svg>