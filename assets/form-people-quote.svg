<svg xmlns="http://www.w3.org/2000/svg" width="900" height="112" viewBox="0 0 900 112" role="img" aria-labelledby="title desc">
  <title id="title">I build technology. I build systems around people, not people around systems.</title>
  <desc id="desc">A centered form. blue quote about building technology and systems around people.</desc>
  <rect width="900" height="112" fill="none"/>
  <text x="92" y="78" fill="#2F6BFF" opacity="0.32" font-family="Georgia, Times New Roman, serif" font-size="76" font-weight="700">“</text>
  <text x="808" y="94" text-anchor="end" fill="#2F6BFF" opacity="0.32" font-family="Georgia, Times New Roman, serif" font-size="76" font-weight="700">”</text>
  <g text-anchor="middle" fill="#2F6BFF" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" font-style="italic">
    <text x="450" y="43">I build technology.</text>
    <text x="450" y="76">I build systems around people, not people around systems.</text>
  </g>
</svg>